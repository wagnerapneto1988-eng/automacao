<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buffet Vó Sabina | Eventos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="site" id="inicio">
  <img class="layout" src="assets/layout.jpg" alt="Buffet Vó Sabina">

  <!-- NAV clicável sem alterar o visual -->
  <button class="hotspot nav-inicio" data-section="inicio" aria-label="Início"></button>
  <button class="hotspot nav-sobre" data-section="sobre" aria-label="Sobre Nós"></button>
  <button class="hotspot nav-servicos" data-section="servicos" aria-label="Serviços"></button>
  <button class="hotspot nav-eventos" data-section="eventos" aria-label="Eventos"></button>
  <button class="hotspot nav-galeria" data-section="galeria" aria-label="Galeria"></button>
  <button class="hotspot nav-depoimentos" data-section="depoimentos" aria-label="Depoimentos"></button>
  <button class="hotspot nav-contato" data-section="contato" aria-label="Contato"></button>

  <!-- CTAs clicáveis -->
  <a class="hotspot orçamento-top" id="orcamentoTop" href="#" aria-label="Quero um orçamento"></a>
  <a class="hotspot orçamento-main" id="orcamentoMain" href="#" aria-label="Quero um orçamento agora"></a>
  <button class="hotspot galeria-main" data-section="galeria" aria-label="Ver galeria"></button>
  <button class="hotspot doces-main" data-section="doces" aria-label="Ver doces gourmet"></button>

  <!-- Ícone flutuante SOMENTE WhatsApp, sem número/texto -->
  <a id="whatsappFloat" class="whatsapp-float" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path fill="currentColor" d="M16.1 3C9 3 3.2 8.7 3.2 15.8c0 2.5.7 4.9 2.1 7L3 29l6.4-2.1a13 13 0 0 0 6.7 1.8c7.1 0 12.9-5.7 12.9-12.9S23.2 3 16.1 3Zm0 23.4a10.6 10.6 0 0 1-5.4-1.5l-.4-.2-3.8 1.2 1.2-3.7-.2-.4a10.5 10.5 0 1 1 8.6 4.6Zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-1.8-.9-3-1.6-4.2-3.6-.3-.5.3-.5.9-1.7.1-.2.1-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.4 1.4 3.6c.2.2 2.4 3.7 5.9 5.2 2.2.9 3.1 1 4.2.8.7-.1 1.9-.8 2.2-1.5.3-.7.3-1.3.2-1.5-.1-.1-.3-.2-.6-.3Z"/>
    </svg>
  </a>
</div>

<!-- Painel JS navegável -->
<div class="panel-backdrop" id="panelBackdrop"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <button class="close" id="closePanel" aria-label="Fechar">×</button>
  <div id="panelContent"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
